components:
  schemas:
    TaskRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 120
          minLength: 0
        description:
          type: string
          maxLength: 5000
          minLength: 0
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        dueDate:
          type: string
          format: date
        assigneeId:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - TODO
          - IN_PROGRESS
          - DONE
      required:
      - priority
      - status
      - title
    TaskDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - TODO
          - IN_PROGRESS
          - DONE
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        dueDate:
          type: string
          format: date
        assignee:
          $ref: "#/components/schemas/UserDto"
        projectId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - createdAt
      - id
      - priority
      - projectId
      - status
      - title
      - updatedAt
    UserDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
      - createdAt
      - email
      - id
      - name
    ProjectRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
        description:
          type: string
          maxLength: 5000
          minLength: 0
      required:
      - name
    ProjectDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        owner:
          $ref: "#/components/schemas/UserDto"
        createdAt:
          type: string
          format: date-time
      required:
      - createdAt
      - id
      - name
      - owner
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
        email:
          type: string
          maxLength: 255
          minLength: 0
        password:
          type: string
          maxLength: 72
          minLength: 8
      required:
      - email
      - name
      - password
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserDto"
      required:
      - token
      - user
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    StatusRequest:
      type: object
      properties:
        status:
          type: string
          enum:
          - TODO
          - IN_PROGRESS
          - DONE
      required:
      - status
    ActivityDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        actor:
          $ref: "#/components/schemas/UserDto"
        previousStatus:
          type: string
          enum:
          - TODO
          - IN_PROGRESS
          - DONE
        newStatus:
          type: string
          enum:
          - TODO
          - IN_PROGRESS
          - DONE
        createdAt:
          type: string
          format: date-time
      required:
      - actor
      - createdAt
      - id
      - newStatus
    TaskPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/TaskDto"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
      required:
      - content
      - page
      - size
      - totalElements
      - totalPages
    SummaryDto:
      type: object
      properties:
        TODO:
          type: integer
          format: int64
        IN_PROGRESS:
          type: integer
          format: int64
        DONE:
          type: integer
          format: int64
        overdue:
          type: integer
          format: int64
      required:
      - DONE
      - IN_PROGRESS
      - TODO
      - overdue
